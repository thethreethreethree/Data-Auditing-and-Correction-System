<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DACS — Data Auditing &amp; Correction System</title>
<style>
  :root {
    --bg:#0f1419; --panel:#171d26; --panel2:#1d2531; --line:#2a3340; --ink:#e6edf3;
    --mut:#8b97a7; --ok:#2ea043; --okbg:#13351d; --bad:#e5484d; --badbg:#3a1416;
    --warn:#e3a008; --warnbg:#3a2c08; --acc:#4493f8;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  a { color:var(--acc); }
  header { padding:18px 24px; border-bottom:1px solid var(--line); background:var(--panel);
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:18px; letter-spacing:.2px; }
  header .tag { color:var(--mut); font-size:12.5px; }
  header .badge { margin-left:auto; color:var(--mut); font-size:12.5px; }
  main { max-width:1180px; margin:0 auto; padding:22px 24px 60px; }

  #drop { border:1.5px dashed var(--line); border-radius:12px; padding:34px; text-align:center;
    background:var(--panel); transition:.15s; cursor:pointer; }
  #drop.over { border-color:var(--acc); background:#13202f; }
  #drop h2 { margin:0 0 6px; font-size:16px; }
  #drop p { margin:4px 0; color:var(--mut); }
  #drop label { display:inline-block; margin-top:12px; background:var(--acc); color:#04101f;
    font-weight:600; padding:9px 16px; border-radius:8px; cursor:pointer; }
  #file { display:none; }

  #summary { display:flex; gap:12px; flex-wrap:wrap; margin:18px 0 6px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:12px 16px; min-width:96px; }
  .card .num { font-size:22px; font-weight:700; }
  .card .lbl { color:var(--mut); font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
  .card.ok .num { color:var(--ok); } .card.bad .num { color:var(--bad); } .card.warn .num { color:var(--warn); }

  #toolbar { display:none; gap:10px; align-items:center; flex-wrap:wrap; margin:16px 0 10px; }
  .filter { background:var(--panel2); border:1px solid var(--line); color:var(--ink);
    padding:7px 12px; border-radius:8px; cursor:pointer; font-size:13px; }
  .filter.active { background:var(--acc); color:#04101f; border-color:var(--acc); font-weight:600; }
  #search { flex:1; min-width:160px; background:var(--panel2); border:1px solid var(--line);
    color:var(--ink); padding:8px 12px; border-radius:8px; }
  .btn { background:var(--panel2); border:1px solid var(--line); color:var(--ink);
    padding:8px 13px; border-radius:8px; cursor:pointer; font-size:13px; }
  .btn.primary { background:var(--ok); color:#04140a; border-color:var(--ok); font-weight:600; }
  .btn.auto { background:var(--acc); color:#04101f; border-color:var(--acc); font-weight:700; }
  #banner { display:none; margin:12px 0 4px; padding:12px 16px; border-radius:10px;
    background:#13202f; border:1px solid #1f3a57; color:var(--ink); font-size:13.5px; }
  #banner b { color:#79c0ff; }
  td.reason .note { margin-top:4px; color:#79c0ff; font-size:12px; }
  #count { color:var(--mut); font-size:12.5px; margin:4px 2px 10px; }

  #tableWrap { border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  thead th { position:sticky; top:0; background:var(--panel2); text-align:left; font-size:11.5px;
    text-transform:uppercase; letter-spacing:.5px; color:var(--mut); padding:10px 12px; border-bottom:1px solid var(--line); }
  tbody td { padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  tbody tr:hover { background:#141b24; }
  tr.v-CORRECT { box-shadow: inset 3px 0 0 var(--ok); }
  tr.v-INCORRECT { box-shadow: inset 3px 0 0 var(--bad); }
  tr.v-REVIEW { box-shadow: inset 3px 0 0 var(--warn); }
  td.t { font-weight:600; max-width:260px; }
  td.t .sub { color:var(--mut); font-weight:400; font-size:12px; }
  td.rt { color:var(--mut); }
  td.reason { color:var(--mut); font-size:12.5px; max-width:300px; }
  .empty { text-align:center; color:var(--mut); padding:24px; }

  .chip { font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px; letter-spacing:.3px; }
  .chip.CORRECT { background:var(--okbg); color:#56d364; } .chip.INCORRECT { background:var(--badbg); color:#ff7b72; }
  .chip.REVIEW { background:var(--warnbg); color:#e3b341; }
  .conf { font-size:11px; padding:2px 7px; border-radius:6px; background:var(--panel2); color:var(--mut); }
  .conf.high { color:#56d364; } .conf.medium { color:#e3b341; } .conf.low { color:var(--mut); }
  select.decision { background:var(--panel2); color:var(--ink); border:1px solid var(--line);
    border-radius:7px; padding:6px 8px; font-size:12.5px; }
</style>
</head>
<body>
<header>
  <h1>DACS</h1>
  <span class="tag">Data Auditing &amp; Correction System · category-relevance audit</span>
  <span class="badge" id="fileBadge"></span>
</header>

<main>
  <div id="drop">
    <h2>Drop a scraped places CSV here</h2>
    <p>Each place is checked against the category it was filed under (its <code>Source Query</code>).</p>
    <p style="font-size:12.5px">Everything runs in your browser — no upload, nothing leaves your machine.</p>
    <label for="file">Choose CSV</label>
    <input type="file" id="file" accept=".csv" />
  </div>

  <div id="summary"></div>

  <div id="toolbar">
    <button class="filter active" data-filter="all">All</button>
    <button class="filter" data-filter="INCORRECT">Mismatches</button>
    <button class="filter" data-filter="REVIEW">Review</button>
    <button class="filter" data-filter="CORRECT">Matches</button>
    <button class="filter" data-filter="flagged">Flagged ⚑</button>
    <input id="search" type="text" placeholder="search place, type, city…" />
    <button class="btn auto" id="autoBtn" title="Auto-apply every decision — keep / re-file / remove — no per-row review">⚡ Auto-correct</button>
    <button class="btn" id="acceptAll" title="Reset every row to the engine's proposed action">Reset</button>
    <button class="btn" id="logBtn">Export audit log</button>
    <button class="btn primary" id="exportBtn">Export corrected CSV</button>
  </div>
  <div id="banner"></div>
  <div id="count"></div>

  <div id="tableWrap"></div>
</main>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
